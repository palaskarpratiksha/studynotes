<!DOCTYPE html>
<html>
<head>
    <title>Delete Note</title>
</head>
<body>

<h2>Delete Note</h2>

<p>Are you sure you want to delete "{{ note.title }}"?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>

<a href="{% url 'notes_list' %}">Cancel</a>

</body>
</html>
